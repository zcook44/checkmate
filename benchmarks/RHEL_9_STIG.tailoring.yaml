# RHEL 9 DISA STIG V2R10 checklist tailoring.
# rule_name is the SSG remediation rule name. STIG/SV IDs come from V2R10.
# status: auto keeps the scan's candidate status; set an explicit CKLB status
# only after reviewing the control and updating the administrator comment.
# This file applies to EVERY RHEL 9 host converted with this library.
rules:
  - rule_name: xwindows_remove_packages
    stig_id: V-257837
    sv_id: SV-257837r1268251_rule
    status: auto
    comment: "Remediation excluded to retain the graphical display manager where required; confirm applicability for this host."
  - rule_name: xwindows_runlevel_target
    stig_id: V-257781
    sv_id: SV-257781r1268251_rule
    status: auto
    comment: "Remediation excluded to retain graphical startup where required; confirm applicability for this host."
  - rule_name: package_gssproxy_removed
    stig_id: V-257832
    sv_id: SV-257832r1155653_rule
    status: auto
    comment: "Remediation excluded to retain gssproxy for dependent services; confirm applicability for this host."
  - rule_name: network_configure_name_resolution
    stig_id: V-257948
    sv_id: SV-257948r1268251_rule
    status: auto
    comment: "Remediation excluded to preserve existing DNS configuration; review the configured name servers."
  - rule_name: mount_option_home_noexec
    stig_id: V-257852
    sv_id: SV-257852r1268251_rule
    status: auto
    comment: "Remediation excluded pending review of home-directory execution requirements."
  - rule_name: mount_option_tmp_noexec
    stig_id: V-257867
    sv_id: SV-257867r958804_rule
    status: auto
    comment: "Remediation excluded to preserve /tmp execution behavior; verify the mount configuration."
  - rule_name: mount_option_var_tmp_noexec
    stig_id: V-257877
    sv_id: SV-257877r958804_rule
    status: auto
    comment: "Remediation excluded to preserve /var/tmp execution behavior; verify the mount configuration."
  - rule_name: sysctl_user_max_user_namespaces_no_remediation
    stig_id: V-257816
    sv_id: SV-257816r1268251_rule
    status: auto
    comment: "Remediation excluded to retain user namespaces for workloads that require them; verify the current setting."
  - rule_name: service_fapolicyd_enabled
    stig_id: V-258090
    sv_id: SV-258090r958808_rule
    status: auto
    comment: "Remediation excluded pending review of fapolicyd impact on installed workloads."
  - rule_name: sudo_remove_nopasswd
    stig_id: V-258106
    sv_id: SV-258106r1102061_rule
    status: not_a_finding
    comment: "Passwordless sudo access is required for lab functions."
  - rule_name: package_nfs-utils_removed
    stig_id: V-257828
    sv_id: SV-257828r1044894_rule
    status: auto
    comment: "Remediation excluded to retain the NFS client package where required; verify whether the service is needed."
  - rule_name: mount_option_nodev_remote_filesystems
    stig_id: V-257854
    sv_id: SV-257854r1268251_rule
    status: auto
    comment: "Remediation excluded pending review of NFS mount device options."
  - rule_name: mount_option_noexec_remote_filesystems
    stig_id: V-257855
    sv_id: SV-257855r1268251_rule
    status: auto
    comment: "Remediation excluded to preserve required NFS execution behavior; verify the mount options."
